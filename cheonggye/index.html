<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--red:#F43131;--blue:#156DFF;--yellow:#FFC100;--wine:#4A0B18;--ink:#0E0E0E;--cream:#FFFDFC;--pad:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit}
/* mock banner */
.mock{position:fixed;left:0;right:0;top:0;z-index:50;background:#000;color:#fff;font-size:12px;padding:9px var(--pad);display:flex;gap:14px;align-items:center;letter-spacing:-.01em;border-bottom:1px solid #222}
.mock b{color:var(--yellow);font-weight:800}
.mock a{color:#fff;font-weight:700;margin-left:auto;text-decoration:none;border-bottom:1px solid var(--yellow);white-space:nowrap}
/* top bar */
.bar{position:fixed;left:0;right:0;top:34px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:14px var(--pad);pointer-events:none}
.bar>*{pointer-events:auto}
.logo{font-weight:900;font-size:18px;letter-spacing:-.02em;color:#fff;text-decoration:none;text-shadow:0 1px 10px rgba(0,0,0,.6)}
.logo small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;opacity:.85;margin-top:2px}
.hint{font-size:12px;font-weight:700;letter-spacing:.04em;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}
.hint i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-right:8px;vertical-align:1px}
/* stage */
.stage{position:fixed;inset:0;overflow:hidden;background:#000;cursor:zoom-in;user-select:none;-webkit-user-select:none}
.stage.zoomed{cursor:default}
.photo{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform 1.05s cubic-bezier(.22,.8,.2,1);will-change:transform}
.kb{position:absolute;inset:0;animation:drift 26s ease-in-out infinite alternate;transform-origin:50% 45%}
.zoomed .kb{animation-play-state:paused}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.07) translate(-.6%,.5%)}}
@media (prefers-reduced-motion:reduce){.kb{animation:none}}
.kb img{position:absolute;display:block}
.kb img.base{left:0;top:0;width:100%;height:100%}
.kb img.hi{left:32.635%;top:38.736%;width:33.995%;height:27.523%}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 42%,rgba(0,0,0,.55) 100%)}
/* machines */
.m{position:absolute;border-radius:6px;cursor:pointer;outline:0}
.m .lab{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.92);color:#000;font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 7px;border-radius:3px;opacity:0;transition:opacity .25s,transform .25s}
.m:hover .lab,.m:focus-visible .lab{opacity:1;transform:translateX(-50%) translateY(-2px)}
.m .ring{position:absolute;inset:-2px;border:2px solid rgba(255,255,255,0);border-radius:6px;transition:border-color .25s,box-shadow .25s}
.m:hover .ring,.m:focus-visible .ring{border-color:rgba(255,255,255,.8);box-shadow:0 0 0 4px rgba(255,193,0,.25)}
.zoomed .m:not(.on){pointer-events:none}
.zoomed .m .lab{display:none}
.zoomed .m .ring{border-color:transparent!important;box-shadow:none!important}
.m .dot{position:absolute;left:50%;top:8%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 0 rgba(255,193,0,.6);animation:pulse 2.2s ease-out infinite}
.m:nth-child(2) .dot{animation-delay:.4s}.m:nth-child(3) .dot{animation-delay:.8s}.m:nth-child(4) .dot{animation-delay:1.2s}.m:nth-child(5) .dot{animation-delay:1.6s}
.zoomed .m .dot{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,193,0,.7)}70%{box-shadow:0 0 0 12px rgba(255,193,0,0)}100%{box-shadow:0 0 0 0 rgba(255,193,0,0)}}
/* slots (shown only when a machine is zoomed) */
.slots{position:absolute;left:0;right:0;top:44%;bottom:0;display:none;grid-auto-flow:column;grid-auto-columns:1fr;gap:1.5%;padding:0 3%}
.m.on .slots{display:grid}
.slot{border:0;background:transparent;border-radius:3px;cursor:pointer;position:relative;padding:0}
.slot::after{content:"";position:absolute;inset:0;border-radius:3px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.04);transition:background .2s,border-color .2s}
.slot:hover::after,.slot.sel::after{border-color:var(--yellow);background:rgba(255,193,0,.16)}
.slot b{position:absolute;left:50%;bottom:-7%;transform:translate(-50%,100%);font-size:4px;font-weight:800;letter-spacing:.04em;background:#fff;color:#000;padding:.5px 2px;border-radius:1px;white-space:nowrap}
.slot.sel b{background:var(--yellow)}
/* rotating label ring (carousel) */
.ringwrap{position:absolute;perspective:2600px;perspective-origin:50% 140%;pointer-events:none}
.ring3d{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;animation:spin 36s linear infinite}
.zoomed .ring3d{animation-play-state:paused}
.ringwrap.paused .ring3d{animation-play-state:paused}
@keyframes spin{from{transform:rotateX(-6deg) rotateY(0)}to{transform:rotateX(-6deg) rotateY(360deg)}}
.tag3{position:absolute;left:0;top:0;transform-style:preserve-3d;pointer-events:auto}
.tag3 button{transform:translate(-50%,-50%);display:block;white-space:nowrap;border:0;border-radius:999px;background:rgba(14,14,14,.82);color:#fff;font-size:9px;font-weight:800;letter-spacing:.06em;padding:5px 9px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.22);cursor:pointer;transition:background .2s,color .2s}
.tag3 button i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--red)}
.tag3 button.sb i{background:var(--blue)}.tag3 button.pr i{background:var(--yellow)}
.tag3 button:hover{background:#fff;color:#000}
.tag3.back button{opacity:.28;pointer-events:none;filter:blur(.4px)}
.zoomed .ringwrap{opacity:0;transition:opacity .4s;pointer-events:none}
.ringwrap{transition:opacity .6s}
/* back / controls */
.back{position:fixed;left:var(--pad);bottom:28px;z-index:40;display:none;align-items:center;gap:10px;background:#fff;color:#000;border:0;padding:12px 16px;font-weight:800;font-size:13px;letter-spacing:.04em;border-radius:4px;cursor:pointer}
.zoomed ~ .back,.back.show{display:flex}
.press{position:fixed;z-index:45;width:54px;height:54px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none}
.press.on{display:block}
.press svg{width:100%;height:100%;transform:rotate(-90deg)}
.press circle{fill:none;stroke-width:4}
.press .bg{stroke:rgba(255,255,255,.25)}
.press .fg{stroke:var(--yellow);stroke-dasharray:150;stroke-dashoffset:150;animation:fill .55s linear forwards}
@keyframes fill{to{stroke-dashoffset:0}}
/* panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:46;background:var(--cream);color:var(--ink);transform:translateX(104%);transition:transform .6s cubic-bezier(.22,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.35)}
.panel.open{transform:none}
.panel header{padding:92px 28px 0;display:flex;justify-content:space-between;align-items:flex-start}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:#777}
.x{border:0;background:#000;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1}
.panel .body{padding:14px 28px 28px;overflow:auto;flex:1}
.panel h2{font-size:28px;line-height:1.1;letter-spacing:-.04em;margin:8px 0 4px;font-weight:900}
.panel .en{font-size:14px;color:#555;margin:0 0 14px;letter-spacing:-.01em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.tag{font-size:10px;font-weight:800;letter-spacing:.08em;padding:4px 8px;border-radius:3px;background:#eee;color:#000}
.tag.red{background:var(--red);color:#fff}.tag.sb{background:var(--blue);color:#fff}.tag.pr{background:#000;color:#fff}
.kv{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;font-size:14px;margin:0 0 18px}
.kv dt{color:#777;font-weight:700;margin:0}.kv dd{margin:0;font-weight:600}
.note{font-size:14px;line-height:1.6;color:#333;margin:0 0 18px;letter-spacing:-.01em}
.lvl{margin:0 0 20px}
.lvl .t{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.06em;color:#555;margin-bottom:6px}
.lvl .b{height:8px;background:#e8e6e1;border-radius:999px;overflow:hidden}
.lvl .b i{display:block;height:100%;background:var(--wine);border-radius:999px;transition:width .8s}
.cta{display:flex;gap:8px}
.cta button{flex:1;border:0;padding:14px;font-weight:800;font-size:13px;letter-spacing:.04em;border-radius:4px;cursor:pointer;background:#000;color:#fff}
.cta button.ghost{background:transparent;border:1.5px solid #000;color:#000}
.sample{font-size:11px;color:#999;margin-top:16px;line-height:1.5}
.panel .machine{font-size:12px;color:#555;margin:0 0 14px;font-weight:700}
.panel .machine b{color:#000}
.list{list-style:none;padding:0;margin:0 0 14px;border-top:1px solid #e3e1dc}
.list li{border-bottom:1px solid #e3e1dc}
.list button{width:100%;text-align:left;border:0;background:transparent;padding:11px 0;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:-.01em}
.list button small{color:#777;font-weight:600;font-size:12px;margin-left:auto;white-space:nowrap}
.list button i{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.list button i.sb{background:var(--blue)}.list button i.pr{background:var(--yellow)}
.list button:hover{color:var(--wine)}
/* intro */
.intro{position:fixed;left:var(--pad);bottom:28px;z-index:40;max-width:440px;pointer-events:none}
.intro h1{font-size:clamp(26px,3.6vw,44px);line-height:1.02;letter-spacing:-.045em;margin:0 0 10px;font-weight:900;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.intro h1 span{color:var(--yellow)}
.intro p{margin:0;font-size:14px;line-height:1.5;opacity:.9;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.zoomed ~ .intro{opacity:0;transition:opacity .3s}
.intro{transition:opacity .5s}
.foot{position:fixed;right:var(--pad);bottom:28px;z-index:40;font-size:11px;letter-spacing:.1em;font-weight:800;opacity:.8;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.zoomed ~ .foot{display:none}
@media (max-width:720px){
 :root{--pad:16px}
 .mock{font-size:11px;padding:8px var(--pad)}
 .hint{display:none}
 .intro{bottom:22px;max-width:70%}
 .foot{display:none}
 .panel{top:auto;height:min(62vh,540px);width:100%;border-radius:18px 18px 0 0;transform:translateY(104%)}
 .panel header{padding:18px 20px 0}
 .panel .body{padding:10px 20px 24px}
 .panel h2{font-size:24px}
 .back{bottom:auto;top:54px;right:var(--pad);left:auto}
 .tag3 button{font-size:10px;padding:6px 9px}
}
/* embed mode: used inside the campaign page "What's on tap tonight" */
.embed .mock,.embed .logo,.embed .intro,.embed .foot{display:none}
.embed .bar{top:0;justify-content:flex-end}
html.embed,html.embed body{overscroll-behavior:auto}
.embed .panel header{padding-top:24px}
@media (max-width:720px){.embed .back{top:12px}}
</style>
</head>
<body>
<div class="mock"><span><b>MOCKUP</b> 청계 삼일빌딩점 탭 아일랜드 인터랙티브 시안 · 와인 데이터는 샘플</span><a href="../">← 캠페인 시안으로</a></div>

  <p>청계 삼일빌딩점 한가운데 원형 탭 아일랜드. 기계를 누르면 가까이 가고, 와인을 누르면 설명이 나옵니다.</p>

<script>
(()=>{
const W=7354,H=4905; // original photo pixel size (positions below are % of this)
/* machines on the island, left → right. box = [left%, top%, width%, height%] of the photo */
const MACHINES=[
 {id:'sake',   name:'SAKE',      kind:'other', box:[33.48,50.07,1.95,10.83], wines:[]},
 {id:'wk1',    name:'WHISKEY',   kind:'other', box:[35.50,50.07,4.04,10.83], wines:[]},
 {id:'wk2',    name:'WHISKEY',   kind:'other', box:[39.65,50.07,4.88,10.83], wines:[]},
 {id:'c',      name:'TAP 01–04', kind:'wine',  box:[46.02,50.07,5.74,10.83], wines:[4,5,6,7]},
 {id:'p',      name:'PREMIUM',   kind:'wine',  box:[53.03,50.07,5.10,10.83], wines:[0,1,2,3]},
 {id:'r',      name:'TAP 09–12', kind:'wine',  box:[58.77,50.07,4.04,10.83], wines:[8,9,10,11]},
];
/* sample wine data (same 12 as the campaign mockup "What's on tap tonight" · 청계) */
const WINES=[
 {ko:'케이머스 카베르네 소비뇽',en:'Caymus Cabernet Sauvignon',origin:'USA · Napa Valley',cat:'Premium',bottle:null,grape:'카베르네 소비뇽',note:'블랙체리와 카시스, 바닐라와 코코아의 진한 향. 부드럽고 둥근 타닌에 긴 여운. 스테이크·트러플 메뉴와.'},
 {ko:'프루노토 바롤로',en:'Prunotto Barolo',origin:'ITALY · Piemonte',cat:'Premium',bottle:70000,grape:'네비올로',note:'장미와 타르, 말린 체리와 감초. 단단한 타닌과 산도가 길게 이어지는 클래식 바롤로. 스테이크와.'},
 {ko:'폴 자불레 지공다스 피에르 애기유',en:'Paul Jaboulet Aîné Gigondas Pierre Aiguille',origin:'FRANCE · Rhône',cat:'Red',bottle:52000,grape:'그르나슈 · 시라',note:'잘 익은 붉은 과일과 후추, 허브 향. 따뜻하고 풍성한 남부 론 스타일. 한식 안주와도 잘 맞아요.'},

 {ko:'샤또 포메이',en:'Château Fomey',origin:'FRANCE · Bordeaux',cat:'Red',bottle:null,grape:'메를로 · 카베르네',note:'자두와 블랙커런트, 가벼운 삼나무 향. 데일리로 마시기 좋은 보르도. 잠봉뵈르 샌드위치와.'},
 {ko:'레 칼케르 소비뇽 블랑',en:'Les Calcaires Sauvignon Blanc',origin:'FRANCE · Loire',cat:'Sauvignon Blanc',bottle:null,grape:'소비뇽 블랑',note:'자몽과 라임, 풀 내음과 미네랄. 산뜻하고 드라이해서 굴·부라타와 첫 잔으로 좋아요.'},
 {ko:'덕혼 디코이 카베르네 소비뇽',en:'Duckhorn Decoy Cabernet Sauvignon',origin:'USA · California',cat:'Red',bottle:null,grape:'카베르네 소비뇽',note:'블랙베리와 모카, 부드러운 타닌. 캘리포니아다운 풍성함에 균형감이 있는 레드.'},
 {ko:'샤또 메종 블랑쉬',en:'Château Maison Blanche',origin:'FRANCE · Bordeaux',cat:'Red',bottle:38000,grape:'메를로',note:'둥근 과일 맛과 부드러운 질감. 처음 보르도를 마셔 보는 분께 권하는 한 잔.'},

 {ko:'브레드 앤 버터 피노 누아',en:'Bread & Butter Pinot Noir',origin:'USA · California',cat:'Red',bottle:36000,grape:'피노 누아',note:'라즈베리와 바닐라, 이름처럼 부드럽고 버터리한 피노. 혼술로 가장 많이 나가는 잔.'},
 {ko:'토후 소비뇽 블랑',en:'Tohu Sauvignon Blanc',origin:'NEW ZEALAND · Marlborough',cat:'Sauvignon Blanc',bottle:null,grape:'소비뇽 블랑',note:'패션프루트와 구스베리, 톡 쏘는 산도. 삼배체 굴과 가장 잘 맞는 조합.'},

const catCls=c=>c==='Premium'?'pr':c==='Sauvignon Blanc'?'sb':'red';
const catTxt=c=>c==='Premium'?'PREMIUM':c==='Sauvignon Blanc'?'SAUVIGNON BLANC':'RED';
const won=n=>n?n.toLocaleString('ko-KR')+'원':'잔 가격은 탭 화면';
const fakeLevel=i=>[72,41,88,63,55,93,34,80,67,49,76,58][i%12];

const stage=document.getElementById('stage'),photo=document.getElementById('photo'),kb=document.getElementById('kb');
const mwrap=document.getElementById('machines'),ringwrap=document.getElementById('ringwrap'),ring3d=document.getElementById('ring3d');
const panel=document.getElementById('panel'),pbody=document.getElementById('p-body'),peye=document.getElementById('p-eyebrow');
const back=document.getElementById('back'),press=document.getElementById('press'),hint=document.getElementById('hint');

/* ---------- build machines + slots ---------- */
MACHINES.forEach((m,mi)=>{
  const el=document.createElement('div');el.className='m';el.id='m-'+m.id;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',m.name+' 탭 기계');
  el.style.cssText=`left:${m.box[0]}%;top:${m.box[1]}%;width:${m.box[2]}%;height:${m.box[3]}%`;
  el.innerHTML=`<span class="ring"></span><span class="lab">${m.name}</span>${m.kind==='wine'?'<span class="dot"></span>':''}<div class="slots"></div>`;
  const slots=el.querySelector('.slots');
  if(m.kind==='wine'){
    m.wines.forEach((wi,si)=>{const b=document.createElement('button');b.className='slot';b.dataset.w=wi;b.setAttribute('aria-label',WINES[wi].ko);b.innerHTML=`<b>${String(mi===3?si+1:mi===4?si+5:si+9).padStart(2,'0')}</b>`;b.onclick=e=>{e.stopPropagation();selectWine(wi,m,b)};slots.appendChild(b);});
  }
  el.onclick=e=>{e.stopPropagation();if(stage.classList.contains('zoomed')&&cur===m)return;zoomTo(m)};
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();zoomTo(m)}};
  mwrap.appendChild(el);
});

/* ---------- rotating ring of wine labels (sits on the light ring of the island) ---------- */
const RING={cx:49.6,cy:43.6,w:29,h:7}; // % of photo
ringwrap.style.cssText=`left:${RING.cx-RING.w/2}%;top:${RING.cy-RING.h/2}%;width:${RING.w}%;height:${RING.h}%`;
const tagEls=[];
WINES.forEach((w,i)=>{
  const t=document.createElement('div');t.className='tag3';
  const shortName=w.en.split(' ').slice(0,2).join(' ').replace(/,$/,'').toUpperCase();const b=document.createElement('button');b.className=catCls(w.cat);b.innerHTML=`<i></i>${shortName}`;b.title=w.ko;
  b.onclick=e=>{e.stopPropagation();openWine(i)};
  t.appendChild(b);ring3d.appendChild(t);tagEls.push(t);
});
function openWine(i){const m=MACHINES.find(m=>m.wines.includes(i));if(m)zoomTo(m,()=>selectWine(i,m,document.querySelector(`#m-${m.id} .slot[data-w="${i}"]`)))}
/* parent page list click → open that wine here */
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||!e.data.tapEn)return;const i=WINES.findIndex(w=>w.en===e.data.tapEn);if(i>=0)openWine(i)});
let ringR=300;
function layoutRing(){
  ringR=Math.max(80,ringwrap.offsetWidth/2*0.92);
  tagEls.forEach((t,i)=>{t.style.transform=`rotateY(${i*(360/WINES.length)}deg) translateZ(${ringR}px)`});
}
/* fade labels that are at the back of the ring */
let spinT0=performance.now();
function tickRing(){
  const angle=((performance.now()-spinT0)/36000*360)%360;
  tagEls.forEach((t,i)=>{const a=((i*(360/WINES.length))+angle)%360;const z=Math.cos(a*Math.PI/180);t.classList.toggle('back',z<-0.15);t.style.zIndex=Math.round((z+1)*50);});
  requestAnimationFrame(tickRing);
}
ringwrap.addEventListener('mouseenter',()=>ringwrap.classList.add('paused'));
ringwrap.addEventListener('mouseleave',()=>ringwrap.classList.remove('paused'));

/* ---------- layout: photo covers the viewport, island centred ---------- */
let base={w:0,h:0,x:0,y:0},cur=null;
function curScale(){const m=photo.style.transform.match(/scale\(([\d.]+)\)/);return m?+m[1]:1}
function layout(){
  const vw=innerWidth,vh=innerHeight;
  const s=Math.max(vw/W,vh/H)*(vw<720?1.0:1.08);
  base.w=W*s;base.h=H*s;
  const fx=0.495,fy=vw<720?0.53:0.50;   // which photo point sits at viewport centre
  base.x=vw/2-base.w*fx;base.y=vh/2-base.h*fy;
  photo.style.width=base.w+'px';photo.style.height=base.h+'px';
  if(cur)applyZoom(cur,false);else photo.style.transform=`translate(${base.x}px,${base.y}px) scale(1)`;
  layoutRing();
}
function applyZoom(m,animate=true){
  const vw=innerWidth,vh=innerHeight,mobile=vw<720;
  const bx=m.box[0]/100*base.w,by=m.box[1]/100*base.h,bw=m.box[2]/100*base.w,bh=m.box[3]/100*base.h;
  const availW=mobile?vw:vw-Math.min(420,vw*0.4),availH=mobile?vh*0.34:vh;
  const sc=Math.min(availW*0.78/bw,availH*0.62/bh);
  const cx=bx+bw/2,cy=by+bh*0.58;
  const tx=(mobile?vw/2:availW/2)-cx*sc,ty=(mobile?vh*0.22:vh*0.52)-cy*sc;
  if(!animate)photo.style.transition='none';
  photo.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
  if(!animate)requestAnimationFrame(()=>photo.style.transition='');
}
function zoomTo(m,after){
  if(!m)return;
  cur=m;stage.classList.add('zoomed');
  document.querySelectorAll('.m.on').forEach(e=>e.classList.remove('on'));
  document.getElementById('m-'+m.id).classList.add('on');
  applyZoom(m,true);
  back.classList.add('show');
  hint.innerHTML='<i></i>와인을 누르면 설명 · 길게 누르면 뒤로';
  if(m.kind==='wine')showMachine(m);else showOther(m);
  if(after)setTimeout(after,650);
}
function zoomOut(){
  cur=null;stage.classList.remove('zoomed');
  document.querySelectorAll('.m.on').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.slot.sel').forEach(e=>e.classList.remove('sel'));
  photo.style.transform=`translate(${base.x}px,${base.y}px) scale(1)`;
  back.classList.remove('show');closePanel();
  hint.innerHTML='<i></i>탭을 누르면 가까이 · 길게 누르면 뒤로';
}

/* ---------- panel ---------- */
function openPanel(){panel.classList.add('open');panel.setAttribute('aria-hidden','false')}
function closePanel(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true')}
function showMachine(m){
  peye.textContent='ON TAP · 청계 · '+m.name;
  pbody.innerHTML=`<h2>이 기계에는<br>${m.wines.length}가지가 있어요.</h2><p class="en">아래에서 고르거나, 사진 속 병을 직접 눌러 보세요.</p>
  <ul class="list">${m.wines.map((wi,si)=>{const w=WINES[wi];return `<li><button data-w="${wi}"><i class="${catCls(w.cat)}"></i>${w.ko}<small>${won(w.bottle)}</small></button></li>`}).join('')}</ul>
  <p class="sample">샘플 데이터 · pos.tsb.wine 카탈로그 기준. 실제 탭 배치·잔 가격·잔량은 POS 연동 후 자동으로 바뀝니다.</p>`;
  pbody.querySelectorAll('button[data-w]').forEach(b=>b.onclick=()=>{const wi=+b.dataset.w;const s=document.querySelector(`#m-${m.id} .slot[data-w="${wi}"]`);selectWine(wi,m,s)});
  openPanel();
}
function showOther(m){
  peye.textContent='ON TAP · 청계 · '+m.name;
  pbody.innerHTML=`<h2>${m.name==='SAKE'?'사케 탭':'위스키 탭'}</h2><p class="en">${m.name==='SAKE'?'사케도 한 잔씩.':'싱글몰트도 한 잔씩, 탭에서.'}</p>
  <p class="note">이 시안에서는 와인 탭만 데이터가 들어가 있어요. ${m.name==='SAKE'?'사케':'위스키'} 목록은 POS 연동 때 같이 붙습니다.</p>
  <p class="sample">샘플 · 목업</p>`;
  openPanel();
}
function selectWine(wi,m,slotEl){
  const w=WINES[wi];
  document.querySelectorAll('.slot.sel').forEach(e=>e.classList.remove('sel'));
  if(slotEl)slotEl.classList.add('sel');
  const tapNo=m.id==='c'?m.wines.indexOf(wi)+1:m.id==='p'?m.wines.indexOf(wi)+5:m.wines.indexOf(wi)+9;
  const lv=fakeLevel(wi);
  peye.textContent=`ON TAP · 청계 · TAP ${String(tapNo).padStart(2,'0')}`;
  pbody.innerHTML=`<p class="machine"><b>${m.name}</b> · 탭 ${String(tapNo).padStart(2,'0')}</p>
  <h2>${w.ko}</h2><p class="en">${w.en}</p>
  <div class="tags"><span class="tag ${catCls(w.cat)}">${catTxt(w.cat)}</span><span class="tag">${w.origin.split(' · ')[0]}</span></div>
  <dl class="kv"><dt>산지</dt><dd>${w.origin}</dd><dt>품종</dt><dd>${w.grape}</dd><dt>보틀</dt><dd>${won(w.bottle)}</dd><dt>잔</dt><dd>테이스팅 · 한 잔 두 가지 (탭 화면)</dd></dl>
  <p class="note">${w.note}</p>
  <div class="lvl"><div class="t"><span>남은 양</span><span>${lv}%</span></div><div class="b"><i style="width:0"></i></div></div>
  <div class="cta"><button type="button" onclick="alert('목업입니다. 앱 연동 전이에요.')">앱에서 이 잔 담기</button><button type="button" class="ghost" id="p-back">기계로 돌아가기</button></div>
  <p class="sample">샘플 데이터 · 설명·잔량은 시안용 가짜 값입니다. 실제 잔량은 탭 기계 → TSB 서버 연동 후 60초 단위로 갱신 예정.</p>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const i=pbody.querySelector('.lvl i');if(i)i.style.width=lv+'%'}));
  pbody.querySelector('#p-back').onclick=()=>{document.querySelectorAll('.slot.sel').forEach(e=>e.classList.remove('sel'));showMachine(m)};
  openPanel();
}
document.getElementById('p-close').onclick=()=>{closePanel()};
back.onclick=zoomOut;
addEventListener('keydown',e=>{if(e.key==='Escape'){if(panel.classList.contains('open')&&cur)closePanel();else zoomOut()}});

/* ---------- long press anywhere on the stage = zoom out ---------- */
let pt=null,pTimer=null,lpFired=false;
const LP=550;
function startPress(x,y){cancelPress();pt={x,y};press.style.left=x+'px';press.style.top=y+'px';
  const fg=press.querySelector('.fg');fg.style.animation='none';void fg.offsetWidth;fg.style.animation='';
  press.classList.add('on');pTimer=setTimeout(()=>{press.classList.remove('on');pTimer=null;if(cur){lpFired=true;zoomOut();}},LP);}
function cancelPress(){if(pTimer){clearTimeout(pTimer);pTimer=null}press.classList.remove('on');pt=null}
stage.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;startPress(e.clientX,e.clientY)});
stage.addEventListener('pointermove',e=>{if(pt&&Math.hypot(e.clientX-pt.x,e.clientY-pt.y)>12)cancelPress()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>stage.addEventListener(ev,cancelPress));
stage.addEventListener('contextmenu',e=>e.preventDefault());
/* tap on empty stage while not zoomed → zoom to the centre machine */
stage.addEventListener('click',e=>{if(lpFired){lpFired=false;e.stopPropagation();e.preventDefault();return}if(!cur&&!e.target.closest('.m,.tag3'))zoomTo(MACHINES[3])},true);

addEventListener('resize',layout);
layout();tickRing();
})();
</script>
</body>
</html>
